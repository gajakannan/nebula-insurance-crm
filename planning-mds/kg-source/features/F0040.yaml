notes:
  - 'G1 selected broker_activity; Phase A approved at G3 on 2026-08-31. Phase B plan run
    2026-08-30-af27c9c1 reuses the existing GET /timeline/events contract and proposes ADR-037.'
  - 'Phase B reconciliation: the existing internal Broker timeline implementation checks coarse
    timeline_event:read but does not yet apply record-level broker scope and maps entityName to null.
    F0040 repairs the existing path by applying canonical distribution visibility before count/order/limit
    and joining Broker for name; no parallel feed or policy rule is introduced.'
  - 'Envelope v1 and the public zone shape remain replay-compatible. Broker activity can roll back to the
    existing typed inactive state without removing the registered component needed to render historical messages.'
phase: Neuron Companion
rationale: Activates the existing Broker activity stub as Neuron's second live specialist head. Glance and
  direct broker_activity.list share the established newest-20 authorized Broker timeline feed, while the
  first two-consumer head executor hardens handler/tool/component/timeout validation, failure isolation,
  durable replay, and PII-minimized telemetry. No broker write or cross-zone composition.
