id: capability:neuron-intent-catalog
label: Intent Catalog, Prompt Registry, and Composed Resolution Contract
notes: 'Code-reviewed intent-catalog.yaml (active domains/actions -> registered heads, startup cross-checked),
  versioned prompt fragments + composed resolver prompt loaded with hashes, and the scope/intent/resolution
  JSON schemas + deterministic invariants. Invalid catalog/prompt/schema prevents readiness. The observed
  redirect+renewals.list_attention and invented show_renewals_needing_attention are regression fixtures.

  F0040 activates only broker_activity.list and adds fixtures that reject broker writes, filters, unknown
  actions, and cross-domain proposals without invoking an engine tool.

  '
