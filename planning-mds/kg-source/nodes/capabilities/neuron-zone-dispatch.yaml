id: capability:neuron-zone-dispatch
label: Zone-Dispatch (multi-head extension point)
notes: 'Orchestrator enumerates registered specialist heads and dispatches per zone; live heads return
  independently validated content/empty/error and stubs return typed inactive. F0040 hardens the first
  two-consumer contract: explicit handler factory, card/plan tool-component-timeout parity, shared run
  lifecycle, per-head failure isolation, and fail-fast readiness. Assembly never reads or ranks another zone.

  '
