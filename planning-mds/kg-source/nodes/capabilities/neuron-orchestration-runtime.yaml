id: capability:neuron-orchestration-runtime
label: Neuron Orchestration Runtime (bootstrap, registries, YAML plans, A2A profile)
notes: 'Stateless runtime: specialist-head/tool/component registries, versioned YAML orchestration assets,
  private Agent Cards, and A2A task trace. F0040 makes an active head fail-fast unless its explicit handler,
  tools, components, output modes, skill, and plan timeout resolve and agree; inactive heads remain tool-free.

  '
rationale:
  - adr: adr:027
    section: Decision §3,§4,§10
    summary: Simple versioned YAML + registered Agent Cards is enough for F0038; MS Agent Framework is
      an unnecessary runtime dependency. Every referenced head/tool/terminal state must resolve or the
      asset is refused.
