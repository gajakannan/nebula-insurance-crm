name: product-quality

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experience
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: experience/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm lint:theme
      - run: pnpm lint:effects
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:accessibility
      - run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual:theme
      - name: Validate frontend evidence against this checkout
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          source = Path('planning-mds/operations/evidence/frontend-quality/latest-run.json')
          manifest = json.loads(source.read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          manifest['revision'] = f'working-tree:{head}'
          Path('planning-mds/operations/evidence/frontend-quality/.ci-latest-run.json').write_text(json.dumps(manifest))
          PY
          trap 'rm -f planning-mds/operations/evidence/frontend-quality/.ci-latest-run.json' EXIT
          python3 planning-mds/testing/validate-frontend-quality-gate.py planning-mds/operations/evidence/frontend-quality/.ci-latest-run.json

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet restore engine/Nebula.slnx
      - run: dotnet build engine/Nebula.slnx --configuration Release --no-restore

  python-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'neuron[dev]'
      - run: python -m pytest neuron/tests
      - run: python -m unittest discover -s scripts/validation/tests -p 'test_*.py'
      - run: python3 scripts/check-policy-parity.py
      - run: python3 scripts/kg/validate.py
      - run: python3 planning-mds/testing/validate-nebula-api-contract.py planning-mds/api/nebula-api.yaml
      - run: python3 scripts/run-lifecycle-gates.py

  evidence-durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed evidence packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python3 scripts/validate-evidence-package.py --base "$BASE_SHA"

  framework-project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: product
      - uses: actions/checkout@v4
        with:
          repository: gajakannan/nebula-agents
          ref: c218bf1776f509a30f71967a1ee79879caa9a000
          path: framework
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r framework/agents/scripts/requirements.txt
      - name: Require project-extension support at the pinned framework revision
        shell: bash
        run: |
          if [[ ! -f framework/agents/scripts/project_checks.py ]]; then
            echo "::error::The pinned framework predates project extensions."
            exit 1
          fi
      - name: Resolve product instructions and manifest
        working-directory: framework
        run: python3 agents/scripts/project_context.py --product-root ../product --action plan-review --json
      - name: Run declared project checks through the shared executor
        id: project_checks
        working-directory: framework
        shell: bash
        run: |
          project_check_run_id="$(date -u +%F)-$(python3 -c 'import secrets; print(secrets.token_hex(4))')"
          echo "run_id=$project_check_run_id" >> "$GITHUB_OUTPUT"
          python3 agents/scripts/project_checks.py --product-root ../product \
            --action plan-review --plan-scope project --target project \
            --run-id "$project_check_run_id"
      - name: Preserve project-check evidence, including failures
        if: ${{ always() && steps.project_checks.outputs.run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: crm-project-check-evidence
          path: product/planning-mds/operations/evidence/runs/${{ steps.project_checks.outputs.run_id }}/
          if-no-files-found: ignore
